<li class="post-item{{itemClass}}">
    {{itemImage}}
    <div class="post-item-text">
        <a class="post-item-title" href="{{basePath}}tangents/{{itemSlug}}/">{{itemTitle}}</a>
        <p class="post-item-meta">{{itemDate}}{{itemTags}}</p>
        <p class="post-item-summary">{{itemSummary}}</p>
    </div>
</li>
